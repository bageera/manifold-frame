name: release

# W8-B3: the binary distribution pipeline.
#
# Triggers:
#   - workflow_dispatch (dry run by default): builds, packages, and
#     VALIDATES the artifacts, then stops — temporary CI artifacts only,
#     no release is created (use it to verify the pipeline; never cut a
#     public version tag just to test this workflow).
#   - push of a v* tag: the full run, ending in a GitHub Release whose
#     assets are the validated per-target archives + external SHA256SUMS.
#
# Publication is ATOMIC at the workflow level: every required platform
# builds and validates before the publish job can run; a partial
# platform failure never produces a release that looks complete.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + validate only; a production publish requires a v* tag)'
        required: true
        default: true
        type: boolean
      include_intel_x86:
        description: 'Also build/validate the Intel (macos-13) experimental leg (opt-in: the retired-label fleet stopped serving runners on the first dry run)'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: never

jobs:
  matrix_setup:
    # W8-B3 dry-run finding: the Intel (macos-13) leg stayed QUEUED with
    # no runner assigned for 9 hours (the retired-label fleet is not
    # serving runners) and blocked the REQUIRED platforms' downstream
    # stages. The Intel leg is now OPT-IN: outcome recorded either way
    # (pass, fail, or unavailable) — required platforms never wait on
    # runner availability that may not come back.
    runs-on: ubuntu-latest
    outputs:
      stage_matrix: ${{ steps.set.outputs.stage_matrix }}
    steps:
      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          linux   = {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "expect_arch": "x86_64", "fixtures": True,  "experimental": False}
          macarm  = {"os": "macos-latest",  "target": "aarch64-apple-darwin",    "expect_arch": "arm64",  "fixtures": False, "experimental": False}
          macintl = {"os": "macos-13",      "target": "x86_64-apple-darwin",     "expect_arch": "x86_64", "fixtures": False, "experimental": True}
          include = [linux, macarm]
          if "${{ inputs.include_intel_x86 }}" == "true":
              include.append(macintel)
          print(f"stage_matrix={json.dumps({'include': include})}")
          PY

  build:
    # Native builds ONLY: each leg runs on a runner whose architecture
    # IS the target (package_release.py hard-refuses a cross build, and
    # records runner arch separately from the target). Matrix notes:
    #   - linux-arm64: optional extension, deferred (one matrix row when
    #     wanted; the script already supports any native triple)
    #   - linux-i686: CI verification retained, distribution deferred
    #   - windows: deferred
    needs: matrix_setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_setup.outputs.stage_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor the lock-pinned engine into ../manifold
        run: python3 scripts/vendor_engine.py --into ../manifold
      - name: Conformance fixtures for the validator (once; artifacts of THIS build)
        # The validator tests the files we distribute against the same
        # conformance set the source tree passes — regenerated from this
        # very checkout, uploaded once.
        run: MNFX_WRITE_FIXTURES=/tmp/w6e/fixtures cargo test -q --locked -p manifold-frame --test w6e_conformance fixtures_write > /dev/null
      - name: Package the release archive
        run: python3 scripts/package_release.py --target ${{ matrix.target }} --git-tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: w6e-fixtures
          path: /tmp/w6e/fixtures/

  validate:
    needs: [matrix_setup, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_setup.outputs.stage_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4   # abidec.c + the validator itself
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: w6e-fixtures
          path: fixtures/
      - run: python3 scripts/validate_release.py --archive dist/*.tar.gz --fixtures-dir fixtures/ --expect-arch ${{ matrix.expect_arch }}

  consumer-b4:
    # W8-B4: validation ENTIRELY outside the producer environment. No
    # Rust build, no engine tree, no Cargo — the job links every bridge
    # against the DOWNLOADED archive only, and the linkage audit fails
    # on any build-path leak (B4.1's teeth). The libvips and ImageMagick
    # gates repeat their W6 correctness against the packaged ABI.
    needs: [matrix_setup, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_setup.outputs.stage_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4   # the adapter SOURCES = the application under test
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: w6e-fixtures
          path: fixtures/
      - run: mkdir consumer && tar -xzf dist/*.tar.gz -C consumer --strip-components=1
      - name: Install the consumer-side image stacks (libvips / ImageMagick / Pillow)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y libvips-dev libmagickcore-dev python3-pil
          else
            brew install vips imagemagick
            python3 -m pip install --quiet --user pillow || \
              python3 -m pip install --quiet --user --break-system-packages pillow
          fi
      - run: bash scripts/b4_consumer_gate.sh --root "$PWD/consumer" --fixtures "$PWD/fixtures" --evidence b4-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: b4-consumer-${{ matrix.target }}
          path: b4-evidence.json

  publish:
    needs: validate
    # Atomic gate: all REQUIRED legs validated (experimental legs like
    # macos-13 report success to dependents even when skipped/failing,
    # so they can neither create partial-looking releases nor block the
    # required platforms; a required leg's failure blocks publication).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Verify tag ↔ package-version consistency
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, tarfile
          tag = os.environ['GITHUB_REF_NAME']
          expected = tag[1:] if tag.startswith('v') else ''
          seen = set()
          for a in sorted(glob.glob('dist/*.tar.gz')):
              with tarfile.open(a) as t:
                  prov = [m for m in t.getnames() if m.endswith('/provenance.json')]
                  p = json.load(t.extractfile(prov[0]))
              ver = p['package_version']
              if expected and ver != expected:
                  sys.exit(f"{a}: package {ver} != tag {expected} — refusing to publish")
              if ver in seen:
                  sys.exit(f"duplicate package version across archives: {ver}")
              seen.add(ver)
              print(f"{a}: package {ver}, target {p['target']}, runner {p['runner_architecture']}, commit {p['git_commit'][:12]}")
          if not seen:
              sys.exit("no distributable archives produced")
          PY
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Stage a DRAFT release, upload every asset, verify, then publish
        # GitHub asset uploads are not transactional: the draft is
        # created first, every required asset + the external checksum
        # manifest is uploaded and re-downloaded to verify byte identity,
        # and only THEN is the draft published. A partially-uploaded
        # state can never appear publicly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "manifold-frame $GITHUB_REF_NAME" \
            --notes "Per-target archives (bin/ include/ lib/ share/, provenance.json, SHA256SUMS) + external SHA256SUMS. Provenance records: wire v1, git commit, rustc/cargo versions, locked engine version + registry checksum, target and runner architecture, shared-library lists. MNFX v1 wire grammar: docs/mnfx-grammar.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS
          mkdir -p /tmp/asset-verify && cd /tmp/asset-verify
          gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz' --pattern 'SHA256SUMS'
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path
          want = dict(
              line.split()[1::-1] for line in  # "sha  name" -> name: sha
              Path("SHA256SUMS").read_text().splitlines() if line.strip()
          )
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path(".").glob("*.tar.gz")}
          if not local:
              sys.exit("no assets downloaded — upload verification failed")
          missing = [n for n in want if n not in local]
          if missing:
              sys.exit(f"missing uploaded assets: {missing}")
          bad = [n for n, h in local.items() if h != want[n]]
          if bad:
              sys.exit(f"uploaded assets with WRONG bytes: {bad}")
          print(f"asset upload verified: {len(local)} archives byte-identical to the manifest")
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "release published (draft verified then flipped)"
