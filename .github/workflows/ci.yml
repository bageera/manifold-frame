name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The sibling engine repo is a path dependency (../manifold);
      # CI can't use it, so the LOCK-PINNED version is vendored at the
      # expected sibling path (W8-B1: exact version from the committed
      # Cargo.lock — the same resolution local and release builds use —
      # with its published sha256 verified; "whatever cargo search found"
      # is gone). The frame steps run --locked so any resolution drift
      # alarms instead of silently re-basing.
      - name: Vendor the lock-pinned engine into ../manifold
        run: python3 scripts/vendor_engine.py --into ../manifold
      - name: Build provenance record (engine sha, lockfile, toolchain, target)
        run: python3 scripts/write_provenance.py --out w8b1-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: w8b1-provenance
          path: w8b1-provenance.json
      - run: cargo fmt -p manifold-frame -p manifold-frame-capi -- --check
      - run: cargo clippy --locked -p manifold-frame -p manifold-frame-capi --all-targets -- -D warnings
      # Unit + capi tests only: the corpus/acceptance/fuzz gates need
      # the engine repo's image fixtures (a local release gate, not CI —
      # CI proves the independent-consumer build instead).
      - run: cargo test --locked -p manifold-frame --lib -p manifold-frame-capi
      # W6-E: the conformance gate needs only the published engine (no
      # testdata) — runs everywhere, all six formats sample-exact.
      - run: cargo test --locked -p manifold-frame --test w6e_conformance
      - name: cc smoke gate (real compile + link of the C ABI)
        run: |
          cargo build --locked -p manifold-frame-capi --release
          cargo test --locked -p manifold-frame-capi --release
      # NOTE: the CLI/fuzz gates need the real ../manifold working tree
      # (image fixtures); keep them in the local release gate, not CI —
      # CI proves the independent-consumer build instead.

  i686:
    # W5-D: image-size arithmetic and usize conversions are sensitive to
    # platform width; type-check the whole tree for 32-bit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Vendor the lock-pinned engine (same as the linux job)
        run: python3 scripts/vendor_engine.py --into ../manifold
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # W8-A3: cargo check cannot prove runtime arithmetic safety. RUN
      # the hostile-length regression on a real 32-bit executable, in
      # BOTH profiles: debug (overflow checks on — the wrap would panic
      # the add) and release (the wrap would silently pass the bounds
      # check and panic the slice). Requires the 32-bit loader.
      - run: sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y libc6:i386 libgcc-s1:i386
      - run: cargo test --locked --target i686-unknown-linux-gnu -p manifold-frame --lib hostile_stored_len
      - run: cargo test --locked --release --target i686-unknown-linux-gnu -p manifold-frame --lib hostile_stored_len
      - run: cargo check --locked --target i686-unknown-linux-gnu -p manifold-frame -p manifold-frame-capi