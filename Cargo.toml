[package]
name = "manifold-frame"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "MNFX: a versioned lossless image container wrapping Manifold compression streams (alpha, 16-bit, metadata, orientation)"
license = "MIT"
repository = "https://github.com/bageera/manifold-frame"
readme = "README.md"
keywords = ["image", "lossless", "codec", "container", "mnfx"]
categories = ["compression", "multimedia::images"]
publish = true # the registry consumer gate passed; publication follows

[dependencies]
# W1: the MNF8/MNF9 engines (the engines stay unmodified — the wrapper
# only routes embedded pixel layers to their pub decode fns). Published
# consumers resolve the registry version; the path = the working tree.
manifold-codec = { path = "../manifold", version = "1.14" }
zstd = "0.13"

[features]
default = []
# The CLI (encode/decode/verify) needs the engines' image-io surface.
cli = ["manifold-codec/image-io"]

[[bin]]
name = "mnfx"
path = "src/main.rs"
required-features = ["cli"]